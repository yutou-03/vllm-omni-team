# Thinker TP4 on GPUs 0-3; 2 independent Talker TP1 replica(s) on GPUs 4,6; Code2Wav on GPU 5.
# Frozen KV capacity per Thinker rank and per Talker replica matches the prior 4:1 run.
base_config: ../../vllm_omni/deploy/qwen3_omni_moe.yaml
stages:
  - stage_id: 0
    devices: "0,1,2,3"
    tensor_parallel_size: 4
    num_replicas: 1
    gpu_memory_utilization: 0.80
    async_scheduling: false
    kv_cache_memory_bytes: 14136115200
    limit_mm_per_prompt:
      image: 16
      video: 1
      audio: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      seed: 42
      max_tokens: 1024
      ignore_eos: false
  - stage_id: 1
    devices: "4,6"
    tensor_parallel_size: 1
    num_replicas: 2
    gpu_memory_utilization: 0.3
    async_scheduling: false
    kv_cache_memory_bytes: 1894318080
    default_sampling_params:
      temperature: 0.9
      top_p: 1.0
      top_k: 50
      seed: 42
      max_tokens: 4096
      ignore_eos: false
    subtalker_sampling_params:
      do_sample: false
      top_k: 1
  - stage_id: 2
    devices: "5"
