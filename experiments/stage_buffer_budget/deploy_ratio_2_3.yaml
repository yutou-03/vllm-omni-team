# Qwen3-Omni on 6 x A100-40GB: Thinker TP2, three Talker TP1 replicas,
# Code2Wav TP1.  The Talker replicas own three independent KV pools.
# The 2 GiB Thinker pool and shorter model length are required by TP2 memory;
# record them when comparing against the older 4:1 run.
base_config: ../../vllm_omni/deploy/qwen3_omni_moe.yaml
stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    num_replicas: 1
    gpu_memory_utilization: 0.95
    kv_cache_memory_bytes: 2147483648
    max_model_len: 32768
    async_scheduling: false
    limit_mm_per_prompt:
      image: 16
      video: 1
      audio: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      seed: 42
      max_tokens: 1024
      ignore_eos: false
  - stage_id: 1
    devices: "2,3,4"
    tensor_parallel_size: 1
    num_replicas: 3
    gpu_memory_utilization: 0.3
    kv_cache_memory_bytes: 1894318080
    async_scheduling: false
    default_sampling_params:
      temperature: 0.9
      top_p: 1.0
      top_k: 50
      seed: 42
      max_tokens: 4096
      ignore_eos: false
    subtalker_sampling_params:
      do_sample: false
      top_k: 1
  - stage_id: 2
    devices: "5"
